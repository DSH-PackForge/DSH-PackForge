<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="DSH-PackForge — 整合包规范仓库">
  <title>DSH-PackForge · 整合包规范仓库</title>
  <defs>
    <radialGradient id="glow" cx="82%" cy="-10%" r="70%">
      <stop offset="0%" stop-color="#3a2826" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3a2826" stop-opacity="0"/>
    </radialGradient>

    <!-- 网点 -->
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#4c4436"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.30" stop-color="#000000"/>
      <stop offset="0.78" stop-color="#ffffff"/>
    </linearGradient>
    <mask id="dotsMask"><rect width="1280" height="320" fill="url(#fade)"/></mask>
  </defs>

  <!-- 纸（暗） -->
  <rect width="1280" height="320" fill="#211d18"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect width="1280" height="320" fill="url(#dots)" opacity="0.5" mask="url(#dotsMask)"/>

  <!-- 裁切角标 -->
  <g stroke="#4c4436" stroke-width="2" fill="none" stroke-linecap="square">
    <path d="M 24 40 L 24 24 L 40 24"/>
    <path d="M 1240 24 L 1256 24 L 1256 40"/>
    <path d="M 1256 280 L 1256 296 L 1240 296"/>
    <path d="M 40 296 L 24 296 L 24 280"/>
  </g>

  <!-- 层叠线稿 -->
  <g fill="none" stroke="#4c4436" stroke-width="2">
    <rect x="1078" y="42" width="96" height="24" rx="7"/>
    <rect x="1090" y="52" width="96" height="24" rx="7"/>
    <rect x="1102" y="62" width="96" height="24" rx="7" stroke="#e0604f"/>
  </g>

  <!-- 大字水印 -->
  <text x="1236" y="304" font-family="'Songti SC', 'Noto Serif SC', 'SimSun', serif"
        font-size="190" font-weight="700" fill="#ece7de" opacity="0.04" text-anchor="end">匣</text>

  <!-- 外框 -->
  <rect x="8.5" y="8.5" width="1263" height="303" rx="18" fill="none" stroke="#3b352c" stroke-width="1"/>

  <!-- 品牌标记 -->
  <rect x="64" y="56" width="84" height="56" rx="14" fill="#e0604f"/>
  <text x="106" y="92" font-family="Archivo, Inter, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif"
        font-size="24" font-weight="800" letter-spacing="1" fill="#ffffff" text-anchor="middle">DSH</text>
  <text x="164" y="92" font-family="Archivo, Inter, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif"
        font-size="20" font-weight="700" fill="#b5ac9e">PackForge</text>

  <!-- 标题 -->
  <text x="64" y="176" font-family="Archivo, Inter, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif"
        font-size="62" font-weight="800" letter-spacing="-1.5" fill="#ece7de">DSH-PackForge</text>
  <rect x="66" y="192" width="64" height="5" rx="2.5" fill="#e0604f"/>

  <!-- 副标题 -->
  <text x="64" y="232" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif"
        font-size="21" font-weight="600" fill="#b5ac9e">整合包规范 · 规范仓库</text>

  <!-- 一句话 -->
  <text x="64" y="266" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif"
        font-size="16" fill="#8f8678">像玩 Minecraft 整合包一样，<tspan fill="#e0604f" font-weight="600">一键导出、分享、安装</tspan> DSH AI 智能体配置包。</text>

  <!-- 版本药丸 -->
  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace" font-size="13" fill="#b5ac9e">
    <rect x="64" y="284" width="118" height="26" rx="13" fill="#2a2620" stroke="#3b352c"/>
    <text x="80" y="301">manifest v5</text>
    <rect x="192" y="284" width="104" height="26" rx="13" fill="#2a2620" stroke="#3b352c"/>
    <text x="208" y="301">dspack v3</text>
    <rect x="306" y="284" width="196" height="26" rx="13" fill="#2a2620" stroke="#3b352c"/>
    <text x="322" y="301">index schemaVersion 2</text>
  </g>

  <!-- 流程：打包 → 市场 → 安装 -->
  <g>
    <rect x="800" y="112" width="112" height="72" rx="14" fill="#2a2620" stroke="#3b352c"/>
    <text x="856" y="146" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif"
          font-size="19" font-weight="700" fill="#ece7de" text-anchor="middle">打包</text>
    <text x="856" y="167" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
          font-size="11" fill="#8f8678" text-anchor="middle">dspack pack</text>

    <rect x="948" y="112" width="112" height="72" rx="14" fill="#3a2826" stroke="#5a3a34"/>
    <text x="1004" y="146" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif"
          font-size="19" font-weight="700" fill="#e0604f" text-anchor="middle">市场</text>
    <text x="1004" y="167" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
          font-size="11" fill="#e0604f" text-anchor="middle">index.json</text>

    <rect x="1096" y="112" width="112" height="72" rx="14" fill="#2a2620" stroke="#3b352c"/>
    <text x="1152" y="146" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif"
          font-size="19" font-weight="700" fill="#ece7de" text-anchor="middle">安装</text>
    <text x="1152" y="167" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
          font-size="11" fill="#8f8678" text-anchor="middle">dspack install</text>

    <g stroke="#e0604f" stroke-width="2" fill="none">
      <path d="M 916 148 L 938 148"/>
      <path d="M 1064 148 L 1086 148"/>
    </g>
    <path d="M 938 148 l -7 -4 l 0 8 z" fill="#e0604f"/>
    <path d="M 1086 148 l -7 -4 l 0 8 z" fill="#e0604f"/>
  </g>

  <!-- 说明 -->
  <text x="1004" y="232" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif"
        font-size="13" fill="#8f8678" text-anchor="middle">打包端产出 · 市场分发 · 启动器导入</text>
</svg>
