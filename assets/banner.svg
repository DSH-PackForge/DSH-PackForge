<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="DSH-PackForge — 整合包规范仓库">
  <title>DSH-PackForge · 整合包规范仓库</title>
  <defs>
    <radialGradient id="glow" cx="82%" cy="-10%" r="70%">
      <stop offset="0%" stop-color="#f7e5e2" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f7e5e2" stop-opacity="0"/>
    </radialGradient>

    <!-- 网点（纸面质感）：只在中缝以右显现，文字区保持干净 -->
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#cfc5b0"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.42" stop-color="#000000"/>
      <stop offset="0.72" stop-color="#ffffff"/>
    </linearGradient>
    <mask id="dotsMask"><rect width="1280" height="320" fill="url(#fade)"/></mask>
  </defs>

  <!-- 纸 -->
  <rect width="1280" height="320" fill="#f6f2ea"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect width="1280" height="320" fill="url(#dots)" opacity="0.55" mask="url(#dotsMask)"/>

  <!-- 裁切角标（印张语汇） -->
  <g stroke="#cfc5b0" stroke-width="2" fill="none" stroke-linecap="square">
    <path d="M 24 40 L 24 24 L 40 24"/>
    <path d="M 1240 24 L 1256 24 L 1256 40"/>
    <path d="M 1256 280 L 1256 296 L 1240 296"/>
    <path d="M 40 296 L 24 296 L 24 280"/>
  </g>

  <!-- 大字水印：层 -->
  <text x="1236" y="304" font-family="'Songti SC', 'Noto Serif SC', 'SimSun', serif"
        font-size="190" font-weight="700" fill="#2b2620" opacity="0.05" text-anchor="end">层</text>

  <!-- 层叠线稿（层栈语汇，右上） -->
  <g fill="none" stroke="#cfc5b0" stroke-width="2">
    <rect x="1064" y="44" width="96" height="24" rx="7"/>
    <rect x="1076" y="54" width="96" height="24" rx="7"/>
    <rect x="1088" y="64" width="96" height="24" rx="7" stroke="#c0392b"/>
  </g>

  <!-- 外框 -->
  <rect x="8.5" y="8.5" width="1263" height="303" rx="18" fill="none" stroke="#e0d8c8" stroke-width="1"/>

  <!-- 品牌标记（与市场页 .brand-mark 同款） -->
  <rect x="64" y="56" width="84" height="56" rx="14" fill="#c0392b"/>
  <text x="106" y="92" font-family="Archivo, Inter, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif"
        font-size="24" font-weight="800" letter-spacing="1" fill="#ffffff" text-anchor="middle">DSH</text>
  <text x="164" y="92" font-family="Archivo, Inter, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif"
        font-size="20" font-weight="700" fill="#5f574a">PackForge</text>

  <!-- 标题 -->
  <text x="64" y="176" font-family="Archivo, Inter, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif"
        font-size="62" font-weight="800" letter-spacing="-1.5" fill="#2b2620">DSH-PackForge</text>
  <rect x="66" y="192" width="64" height="5" rx="2.5" fill="#c0392b"/>

  <!-- 副标题 -->
  <text x="64" y="232" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif"
        font-size="21" font-weight="600" fill="#5f574a">整合包规范 · 规范仓库</text>

  <!-- 一句话 -->
  <text x="64" y="266" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif"
        font-size="16" fill="#8b8172">像玩 Minecraft 整合包一样，<tspan fill="#c0392b" font-weight="600">一键导出、分享、安装</tspan> DSH AI 智能体配置包。</text>

  <!-- 版本药丸（与市场页 .stat 同款） -->
  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace" font-size="13" fill="#5f574a">
    <rect x="64" y="284" width="118" height="26" rx="13" fill="#fffdf8" stroke="#e0d8c8"/>
    <text x="80" y="301">manifest v5</text>
    <rect x="192" y="284" width="104" height="26" rx="13" fill="#fffdf8" stroke="#e0d8c8"/>
    <text x="208" y="301">dspack v3</text>
    <rect x="306" y="284" width="196" height="26" rx="13" fill="#fffdf8" stroke="#e0d8c8"/>
    <text x="322" y="301">index schemaVersion 2</text>
  </g>

  <!-- 竖排书耳：整合 —— 包罗万象 -->
  <g font-family="'Songti SC', 'Noto Serif SC', 'SimSun', serif" font-size="18" fill="#5f574a" text-anchor="middle">
    <text x="669" y="132">整</text>
    <text x="669" y="156">合</text>
    <text x="669" y="216">包</text>
    <text x="669" y="240">罗</text>
    <text x="669" y="264">万</text>
    <text x="669" y="288">象</text>
  </g>
  <rect x="668" y="172" width="2" height="26" rx="1" fill="#c0392b"/>

  <!-- 三步（纵向）：一条竖线 + 节点 + 左标签 / 右 mono 列 -->
  <line x1="700" y1="64" x2="700" y2="252" stroke="#e0d8c8" stroke-width="1"/>

  <g font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="20" font-weight="700">
    <text x="722" y="85" fill="#2b2620">打包</text>
    <text x="722" y="165" fill="#a12f22">市场</text>
    <text x="722" y="245" fill="#2b2620">安装</text>
  </g>
  <g font-family="ui-monospace, 'SF Mono', 'Menlo', monospace" font-size="11" fill="#8b8172" text-anchor="end">
    <text x="1004" y="84">dspack pack</text>
    <text x="1004" y="164">index.json</text>
    <text x="1004" y="244">dspack install</text>
  </g>

  <!-- 目录引导点线（标签 ↔ mono 值） -->
  <g stroke="#cfc5b0" stroke-width="1" stroke-dasharray="1 6" fill="none">
    <path d="M 786 78 L 896 78"/>
    <path d="M 786 158 L 896 158"/>
    <path d="M 786 238 L 896 238"/>
  </g>

  <!-- 节点：市场为实心（分发中枢） -->
  <circle cx="700" cy="78" r="4.5" fill="#f6f2ea" stroke="#c0392b" stroke-width="2"/>
  <circle cx="700" cy="158" r="5.5" fill="#c0392b"/>
  <circle cx="700" cy="238" r="4.5" fill="#f6f2ea" stroke="#c0392b" stroke-width="2"/>

  <!-- 说明 -->
  <text x="700" y="288" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif"
        font-size="13" fill="#8b8172">打包端产出 · 市场分发 · 启动器导入</text>
</svg>
